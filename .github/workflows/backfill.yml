name: Backfill Historical Stats

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Max days back to backfill (default: 30)'
        required: false
        default: '30'

permissions:
  contents: write
  actions: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install ws

      - name: Pause daily-stats collector
        run: gh workflow disable daily-stats.yml
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run backfill
        run: node scripts/backfill-stats.js --days=${{ github.event.inputs.days || 30 }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daily-stats.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: backfill historical stats (${{ github.event.inputs.days || 30 }} days)"
            git push
          fi

      - name: Resume daily-stats collector
        if: always()
        run: gh workflow enable daily-stats.yml
        env:
          GH_TOKEN: ${{ github.token }}
